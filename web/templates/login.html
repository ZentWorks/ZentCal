{{define "login.html"}}<!doctype html><html lang="{{.Lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZentCal · Anmelden</title><meta name="theme-color" content="#0f1217"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ZentCal"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png"><link rel="stylesheet" href="/static/css/app.css"><script src="/static/js/pwa.js" defer></script></head><body class="auth-bg"><main class="login-wrap"><div class="setup-brand"><img class="brand-logo large" src="/static/icons/zentcal-logo.png" alt="" width="52" height="52"><h1>ZentCal</h1></div><section class="auth-card"><h2>Anmelden</h2>{{if .Error}}<div class="alert danger">{{.Error}}</div>{{end}}{{if eq (index .Data "Step") "password"}}<form method="post" class="stack"><input type="hidden" name="step" value="password"><input type="hidden" name="email" value="{{index .Data "Email"}}"><label>E-Mail<input type="email" value="{{index .Data "Email"}}" readonly aria-readonly="true" autocomplete="username"></label><label>Passwort<input type="password" name="password" required autocomplete="current-password" autofocus></label><button class="btn primary full" type="submit">Anmelden</button>{{if index .Data "ForgotPassword"}}<a class="auth-back-link" href="/forgot-password">Passwort vergessen?</a>{{end}}<a class="auth-back-link" href="/login">Andere E-Mail verwenden</a></form>{{else}}<form method="post" class="stack"><input type="hidden" name="step" value="identify"><label>E-Mail<input type="email" name="email" value="{{index .Data "Email"}}" required autocomplete="username" autofocus></label><button class="btn primary full" type="submit">Weiter</button></form>{{end}}</section><small class="auth-version">ZentCal {{.Version}}</small></main></body></html>{{end}}
