{{define "invite.html"}}<!doctype html><html lang="{{.Lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZentCal · Einladung</title><meta name="theme-color" content="#0f1217"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ZentCal"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png"><link rel="stylesheet" href="/static/css/app.css"><script src="/static/js/pwa.js" defer></script></head><body class="auth-bg"><main class="login-wrap"><div class="setup-brand"><img class="brand-logo large" src="/static/icons/zentcal-logo.png" alt="" width="52" height="52"><div><h1>ZentCal</h1><p>Einladung</p></div></div><section class="auth-card"><h2>Konto aktivieren</h2><p class="muted">Eingeladen als {{.Data.Email}}</p>{{if .Error}}<div class="alert danger">{{.Error}}</div>{{end}}<form method="post" class="stack"><div class="form-row"><label>Vorname<input name="first_name" value="{{.Data.FirstName}}" required autocomplete="off"></label><label>Nachname<input name="last_name" value="{{.Data.LastName}}" autocomplete="off"></label></div><label>Passwort<input type="password" name="password" minlength="10" required></label><button class="btn primary full">Einladung annehmen</button></form></section></main></body></html>{{end}}
