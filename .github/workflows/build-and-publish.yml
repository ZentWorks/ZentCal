name: Build and publish ZentCal

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish ZentCal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true

      - name: Download and verify modules
        run: |
          go mod download all
          go mod verify

      - name: Test
        run: go test -mod=readonly ./...

      - name: Race test
        run: go test -mod=readonly -race ./...

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build
        run: docker build --pull -t zentcal:ci .

      - name: Docker Compose smoke test
        env:
          ZENTCAL_BASE_URL: http://localhost:8080
          ZENTCAL_IMAGE: zentcal:ci
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Read version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^const version = "([^"]+)"/\1/p' cmd/zentcal/main.go)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zentworks/zentcal:latest
            ghcr.io/zentworks/zentcal:${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
