name: Build and publish ZentCal

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish ZentCal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true

      - name: Download and verify modules
        run: |
          go mod download all
          go mod verify

      - name: Test
        run: go test -mod=readonly ./...

      - name: Race test
        run: go test -mod=readonly -race ./...

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Docker build
        run: docker build --pull -t zentcal:ci .

      - name: Docker Compose smoke test
        env:
          ZENTCAL_BASE_URL: http://localhost:8080
          ZENTCAL_IMAGE: zentcal:ci
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Database schema smoke test
        env:
          ZENTCAL_IMAGE: zentcal:ci
        run: |
          columns="$(docker compose exec -T db psql -U zentcal -d zentcal -Atqc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='calendars' AND column_name IN ('admin_managed','admin_manager_user_id','admin_manager_visible')")"
          test "$columns" = "3" || { echo "Missing admin calendar columns: $columns/3"; exit 1; }
          tasks_type="$(docker compose exec -T db psql -U zentcal -d zentcal -Atqc "SELECT count(*) FROM pg_constraint WHERE conname='calendars_type_check' AND pg_get_constraintdef(oid) LIKE '%tasks%'")"
          test "$tasks_type" = "1" || { echo "Missing VTODO collection constraint"; exit 1; }

      - name: CalDAV reminders PostgreSQL integration smoke test
        env:
          ZENTCAL_IMAGE: zentcal:ci
        run: |
          # Execute the actual SQL constants from the Go source against the
          # initialized PostgreSQL schema, not hand-copied test queries.
          python3 - <<'PYREMINDERS' | docker compose exec -T db psql -v ON_ERROR_STOP=1 -U zentcal -d zentcal
          import pathlib
          import re
          import uuid

          source = pathlib.Path('internal/db/reminders.go').read_text(encoding='utf-8')
          def statement(name):
              match = re.search(r'const\s+' + name + r'\s*=\s*`([^`]*)`', source, re.S)
              if not match:
                  raise SystemExit('Missing SQL statement: ' + name)
              return match.group(1).strip().rstrip(';')

          # Reproduce a legacy schema: its CHECK constraint rejected 'tasks'.
          # NOT VALID permits pre-existing tasks rows but still rejects new ones.
          # Execute the *actual newest migration* before exercising DAV SQL.
          migration_source = pathlib.Path('internal/db/migrations.go').read_text(encoding='utf-8')
          migration_sql = re.findall(r'`([^`]*)`', migration_source, re.S)[-1].strip().rstrip(';')
          if 'ADD CONSTRAINT calendars_type_check' not in migration_sql or "'tasks'" not in migration_sql:
              raise SystemExit('Missing VTODO constraint recovery migration')

          uid, calendar_id = str(uuid.uuid4()), str(uuid.uuid4())
          print('BEGIN;')
          print('ALTER TABLE calendars DROP CONSTRAINT IF EXISTS calendars_type_check;')
          print("ALTER TABLE calendars ADD CONSTRAINT calendars_type_check CHECK (type IN ('calendar','resource')) NOT VALID;")
          print(migration_sql + ';')
          print(f"INSERT INTO users(id,name,email,password_hash) VALUES('{uid}','CI Reminders','ci-{uid}@example.invalid','test');")
          print('PREPARE reminders_calendar AS ' + statement('remindersCalendarInsertSQL') + ';')
          print('PREPARE reminders_membership AS ' + statement('remindersMembershipUpsertSQL') + ';')
          for _ in range(2):
              print(f"EXECUTE reminders_calendar('{calendar_id}','{uid}','{calendar_id}');")
              print(f"EXECUTE reminders_membership('{calendar_id}','{uid}','{calendar_id}');")
          print(f"DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM calendars c JOIN memberships m ON m.calendar_id=c.id WHERE c.id='{calendar_id}'::uuid AND c.type='tasks' AND c.system_kind='reminders' AND c.dav_name='{calendar_id}' AND m.user_id='{uid}'::uuid AND m.role='owner' AND m.dav_name='{calendar_id}') THEN RAISE EXCEPTION 'Reminders persistence check failed'; END IF; END $$;")
          print('ROLLBACK;')
          PYREMINDERS

      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Read version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^const version = "([^"]+)"/\1/p' cmd/zentcal/main.go)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zentworks/zentcal:latest
            ghcr.io/zentworks/zentcal:${{ steps.version.outputs.version }}
          provenance: true
          sbom: true
